
<script>
  // Apply the saved theme before the page draws (same rule as src/lib/tema.ts)
  try {
    var t = localStorage.getItem('apm-bo:tema') || 'sistem'
    if (t === 'gelap' || (t === 'sistem' && window.matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.classList.add('dark')
  } catch (e) {}
</script>
